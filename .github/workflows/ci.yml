name: SafeRoute CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test_and_analyze:
    name: Test & Analyze Monorepo
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package:
          - packages/saferoute_core
          - apps/saferoute_app
          - apps/saferoute_admin

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies (${{ matrix.package }})
        run: |
          cd ${{ matrix.package }}
          flutter pub get

      - name: Static Code Analysis (${{ matrix.package }})
        run: |
          cd ${{ matrix.package }}
          flutter analyze

      - name: Run Test Suite (${{ matrix.package }})
        run: |
          cd ${{ matrix.package }}
          flutter test

  build_web_admin:
    name: Build Admin Web Dashboard
    needs: test_and_analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Web Release
        run: |
          cd apps/saferoute_admin
          flutter pub get
          flutter build web --release

      - name: Upload Admin Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saferoute-admin-web
          path: apps/saferoute_admin/build/web/
