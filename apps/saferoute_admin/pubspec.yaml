name: saferoute_admin
description: SafeRoute Web Administration Panel — Fleet command center for schools
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # SafeRoute Core
  saferoute_core:
    path: ../../packages/saferoute_core

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Maps (OpenStreetMap - Zero Google APIs)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Backend & Supabase
  supabase_flutter: ^2.8.4

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
